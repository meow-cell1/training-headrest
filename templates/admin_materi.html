{% extends "base.html" %}{% block body %}
<h1 class="mb-6 text-3xl font-semibold tracking-tight">Materi</h1>
<form method="post" enctype="multipart/form-data" class="mb-8 grid gap-3 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
<input name="title" placeholder="Judul materi" class="w-full rounded-xl border border-zinc-200 px-3.5 py-2.5 text-sm outline-none focus:border-indigo-500"><input type="file" name="file" required class="text-sm text-zinc-500">
<button class="rounded-xl bg-indigo-600 py-3 font-medium text-white hover:bg-indigo-700">Unggah</button></form>
<div class="space-y-3">{% for m in mats %}<div class="flex items-center justify-between rounded-2xl border border-zinc-200 bg-white p-4 shadow-sm">
<a href="/file/{{ m.filename }}" target="_blank" class="font-medium hover:text-indigo-600">{{ m.title }}</a>
<form method="post" action="/admin/materi/hapus/{{ m.id }}" data-confirm="Hapus materi ini?" data-ok-text="Hapus"><button class="text-sm text-red-600 hover:underline">Hapus</button></form></div>
{% else %}<p class="text-zinc-500">Belum ada materi.</p>{% endfor %}</div>{% endblock %}
