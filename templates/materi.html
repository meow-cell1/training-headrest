{% extends "base.html" %}{% block body %}
<div class="mb-2 flex items-end justify-between"><h1 class="text-3xl font-semibold tracking-tight">Materi</h1><a href="/" class="text-sm text-zinc-500 hover:text-zinc-900">Kembali</a></div>
<p class="mb-6 text-sm text-zinc-500">Klik <b>Lihat</b> atau <b>Unduh</b> pada minimal satu materi untuk membuka Post Test.</p>
<div class="space-y-3">{% for m in mats %}
<div class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm">
<div><p class="font-medium">{{ m.title }}</p><p class="mt-0.5 text-xs text-zinc-400">{{ m.created }}</p></div>
<div class="flex gap-2"><a data-open href="/materi/buka/{{ m.id }}" target="_blank" class="rounded-lg border border-zinc-200 px-3.5 py-2 text-sm font-medium hover:bg-zinc-50">Lihat</a>
<a data-open href="/materi/buka/{{ m.id }}?dl=1" class="rounded-lg bg-zinc-900 px-3.5 py-2 text-sm font-medium text-white hover:bg-zinc-800">Unduh</a></div></div>
{% else %}<p class="text-zinc-500">Belum ada materi.</p>{% endfor %}</div>
<div class="mt-8 text-center"><a id="next" href="/tes/post" class="inline-block rounded-xl px-6 py-3 text-sm font-medium {{ 'bg-indigo-600 text-white hover:bg-indigo-700' if post_open else 'pointer-events-none bg-zinc-200 text-zinc-400' }}">Lanjut ke Post Test &rarr;</a></div>
<script>document.querySelectorAll('[data-open]').forEach(a=>a.addEventListener('click',()=>{const n=document.getElementById('next');n.className='inline-block rounded-xl px-6 py-3 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700'}))</script>{% endblock %}
