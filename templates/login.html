{% extends "base.html" %}{% block body %}
<div class="mx-auto mt-10 max-w-sm">
<h1 class="mt-4 text-2xl font-semibold tracking-tight">Login Admin</h1>
<form method="post" class="mt-6 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm">
<input type="password" name="password" required autofocus placeholder="Password" class="w-full rounded-xl border border-zinc-200 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
<button class="mt-4 w-full rounded-xl bg-indigo-600 py-3 font-medium text-white hover:bg-indigo-700">Masuk</button></form>
<p class="mt-4 text-center text-sm text-zinc-400">Bukan admin? <a href="/" class="font-medium text-indigo-600 hover:underline">Kembali ke halaman peserta</a></p></div>{% endblock %}
